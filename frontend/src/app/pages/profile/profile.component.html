<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">⚽</div>
      <h2>Perfil do Olheiro</h2>
    </div>
    
    <div class="profile-details">
      <div class="detail-group">
        <label>Nome de Utilizador</label>
        <input type="text" class="detail-input" [(ngModel)]="username" [readonly]="!isEditing">
      </div>
      
      <div class="detail-group">
        <label>Função no Sistema</label>
        <input *ngIf="!isEditing" type="text" class="detail-input" [value]="role" readonly>
        
        <select *ngIf="isEditing" class="detail-input" [(ngModel)]="role">
          <option value="Caça-Talentos (com miopia)">Caça-Talentos (com miopia)</option>
          <option value="Treinador de Bancada (Mestre dos palpites)">Treinador de Bancada (Mestre dos palpites)</option>
          <option value="Olheiro de Sofá (Scouting no YouTube)">Olheiro de Sofá (Scouting no YouTube)</option>
          <option value="Tático do FM (Venceu a Champions virtual)">Tático do FM (Venceu a Champions virtual)</option>
          <option value="Diretor Desportivo (Orçamento de 5€)">Diretor Desportivo (Orçamento de 5€)</option>
          <option value="Presidente (Despede o treinador ao intervalo)">Presidente (Despede o treinador ao intervalo)</option>
        </select>
      </div>
    </div>

    <div class="profile-actions">
      <button class="btn-edit" (click)="toggleEdit()">
        {{ isEditing ? 'Guardar Alterações' : 'Editar Perfil' }}
      </button>
      <button class="btn-logout" (click)="logout()">Terminar Sessão</button>
    </div>
  </div>

  <div class="history-card">
    <h3>O Meu Histórico 📊</h3>
    
    <p *ngIf="!history || history.length === 0">Ainda não tens comparações guardadas.</p>
    
    <ul *ngIf="history && history.length > 0" style="list-style: none; padding: 0; color: #cbd5e1; text-align: left;">
      <li *ngFor="let item of history; let i = index" style="padding: 15px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
        <div>
          <strong>{{ item.player1 }} vs {{ item.player2 }}</strong><br>
          <span style="color: #10b981; font-size: 0.85rem; font-weight: 600;">🏆 Vencedor: {{ item.winner || 'Empate' }}</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button (click)="verNaArena()" style="background-color: #3b82f6; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">Ver</button>
          <button (click)="eliminarDuelo(i)" style="background-color: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold;">X</button>
        </div>
      </li>
    </ul>
  </div>
</div>
