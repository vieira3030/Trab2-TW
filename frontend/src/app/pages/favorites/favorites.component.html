<div class="favorites-container">
  <div class="header">
    <h1>A Minha Lista de Jogadores 🌟</h1>
  </div>

  <div class="players-grid">
    <div class="player-card-wrapper" *ngFor="let player of favoritePlayers">
       <app-player-card [player]="player"></app-player-card>
       <button class="btn-remove" (click)="removeFavorite(player)">X Remover</button>
    </div>
  </div>
</div>
