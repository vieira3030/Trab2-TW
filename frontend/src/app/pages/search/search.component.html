<div class="search-container">
  <div class="search-card">
    <h2>Pesquisar Plantel de Equipas</h2>
    
    <div class="search-group">
      <input 
        type="text" 
        placeholder="Nome da equipa (ex: Arsenal)..." 
        class="search-input"
        [(ngModel)]="teamName"
      >
      <button class="btn-search" (click)="onSearch()">Carregar Plantel</button>
    </div>
    
    <p class="info-text">Escreve o nome da equipa e carrega no botão para ver os jogadores.</p>
    
    <p *ngIf="errorMessage" class="error-msg">{{ errorMessage }}</p>
    <p *ngIf="isLoading" class="loading-msg">A pesquisar na base de dados...</p>
  </div>

  <div class="players-grid" *ngIf="!isLoading && players.length > 0">
    <div class="player-card-box" *ngFor="let player of players">
      <app-player-card [player]="player"></app-player-card>
    </div>
  </div>
</div>
