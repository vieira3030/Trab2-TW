<div class="favorites-container">
  <h2>A Minha Lista de Jogadores ⭐</h2>

  <div class="results">
    @for (player of favoritePlayers; track player.playerId) {
      <div class="favorite-card">
        <img [src]="player.playerPhoto" alt="Foto de {{ player.playerName }}">
        <h3>{{ player.playerName }}</h3>
        
        <button class="btn-remove" (click)="removePlayer(player.playerId)">❌ Remover</button>
      </div>
    } @empty {
      <div class="empty-state">
        <p>Ainda não tens jogadores guardados.</p>
        <p>Vai à página de pesquisa para recrutares talento!</p>
      </div>
    }
  </div>
</div>
